name : CI 

on:
  push : 
    branches : [main]
  pull_request :
    Branches : [main]


jobs :
  test :
    runs-on : ubuntu-latest 
    steps :
      - uses : actions/checkout@v4
      - uses : actions/setup-python@v5
        with :
          python-version : "3.11"

      - run: pip install -r requirements.txt
      - run: pytest test_api.py -v

  azure-login-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id:  0fef2e9a-347f-44ff-b353-b4d2973d440c 
          tenant-id:  a99950fd-2582-4f30-916e-fc061b7a258b
          subscription-id:  5b66b750-3a71-47ed-8a9a-2fd428157e3c 
      - run: az account show